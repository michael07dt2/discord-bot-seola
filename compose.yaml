services:
  pg:
    image: postgres:18.4-trixie
    container_name: context_pg
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: context
    ports:
      - "15432:5432"
    volumes:
      - context_pgdata:/var/lib/postgresql

volumes:
  context_pgdata:
